type: object
required:
  - email
  - channel
properties:
  email:
    type: string
    description: Customer's email address
    example: ravi@demo.com
  channel:
    type: string
    description: direct_debit is the only supported option for now
    enum:
      - direct_debit
    example: direct_debit
  callback_url:
    type: string
    description: >-
      Fully qualified url (e.g. https://example.com/) to redirect your customer
      to. Some banks require it. If you don't send one, we use the callback URL
      on your dashboard.
    example: http://test.url.com
  use_hosted_url:
    type: boolean
    description: >-
      Set to false to drive the mandate setup in your own UI. When false,
      account and address are required.
    default: true
    example: false
  account:
    $ref: ./CustomerAuthorizationInitializeAccount.yaml
  address:
    $ref: ./CustomerAuthorizationInitializeAddress.yaml
